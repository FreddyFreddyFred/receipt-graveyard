name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project + dev dependencies when pyproject.toml exists
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No dependency file found yet — skipping install."
          fi

      - name: Lint with ruff
        run: |
          pip install ruff
          if [ -d src ] || find . -name "*.py" -not -path "./.venv/*" | grep -q .; then
            ruff check .
          else
            echo "No Python source files yet — skipping ruff."
          fi

      - name: Type check with mypy
        run: |
          pip install mypy
          if [ -d src ]; then
            mypy src/
          else
            echo "No src/ directory yet — skipping mypy."
          fi

      - name: Run tests
        run: |
          pip install pytest
          if [ -d tests ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests/ directory yet — skipping pytest."
          fi
